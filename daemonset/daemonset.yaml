apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: taskhub
  labels:
    app: taskhub
    component: node-agent
spec:
  selector:
    matchLabels:
      app: taskhub
      component: node-agent
  template:
    metadata:
      labels:
        app: taskhub
        component: node-agent
        environment: lab
    spec:
      serviceAccountName: taskhub-agent
      containers:
        - name: node-agent
          image: busybox:1.36
          command:
            - "/bin/sh"
            - "-c"
            - "while true; do echo \"[$(date)] node-agent heartbeat on $(hostname)\"; sleep 30; done"
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
