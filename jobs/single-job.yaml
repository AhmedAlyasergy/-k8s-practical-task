# Pattern 1: Single execution — one Pod, one successful completion is enough.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init-job
  namespace: taskhub
  labels:
    app: taskhub
    component: job
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: taskhub
        component: job
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: busybox:1.36
          command:
            - "/bin/sh"
            - "-c"
            - "echo 'Running one-time database initialization task...'; sleep 5; echo 'Initialization complete.'"
