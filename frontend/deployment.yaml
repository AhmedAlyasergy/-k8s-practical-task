apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: taskhub
  labels:
    app: taskhub
    component: frontend
    environment: lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskhub
      component: frontend
  template:
    metadata:
      labels:
        app: taskhub
        component: frontend
        environment: lab
    spec:
      containers:
        - name: frontend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: taskhub-config
          volumeMounts:
            - name: cache-volume
              mountPath: /tmp/cache
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        # emptyDir: temporary, node-local cache that is wiped when the Pod is
        # removed. Perfect for scratch space that does not need to survive
        # restarts (see README "Storage Explanation").
        - name: cache-volume
          emptyDir: {}
