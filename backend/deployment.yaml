apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: taskhub
  labels:
    app: taskhub
    component: backend
    environment: lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskhub
      component: backend
  template:
    metadata:
      labels:
        app: taskhub
        component: backend
        environment: lab
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args:
            - "-listen=:5678"
            - "-text=TaskHub backend is running"
          ports:
            - containerPort: 5678
          envFrom:
            - configMapRef:
                name: taskhub-config
            - secretRef:
                name: taskhub-secret
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          startupProbe:
            httpGet:
              path: /
              port: 5678
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
